<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ANITEW</title>
    <meta
      name="description"
      content="Hol zurück, was bleiben soll. Gedächtnis ist Technik, kein Talent. Abruftraining, Wiederholungsplanung und ehrliche Messung."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1218" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ANITEW" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <script>
      /* Theme vor dem ersten Paint anwenden. Default bleibt bewusst System. */
      try {
        const theme = localStorage.getItem('anitew.theme.v1')
        document.documentElement.dataset.anitewTheme =
          theme === 'light' || theme === 'dark' ? theme : 'system'
      } catch {
        document.documentElement.dataset.anitewTheme = 'system'
      }

      /*
       * Das fünfsekündige Markenritual gehört nur zum allerersten Öffnen auf
       * diesem Gerät. Danach ist ANITEW sofort wieder ein Werkzeug. Der
       * Query-Schalter ist ausschließlich für den expliziten E2E-Vertrag;
       * normale automatisierte Browser zahlen die fünf Sekunden nicht bei
       * jedem isolierten Testkontext erneut.
       */
      try {
        const key = 'anitew.launch.seen.v3'
        const forced = new URLSearchParams(location.search).get('firstLaunch') === '1'
        const first = forced || (navigator.webdriver !== true && localStorage.getItem(key) !== '1')
        document.documentElement.dataset.anitewFirstLaunch = first ? 'true' : 'false'
        if (first && !forced) localStorage.setItem(key, '1')
      } catch {
        document.documentElement.dataset.anitewFirstLaunch = 'true'
      }
    </script>
    <style>
      /*
       * Splash = Marke, nicht Oberfläche. Deshalb ist seine Sprache immer
       * Englisch und unabhängig von Geräte-, App- und Trainingssprache.
       */
      #anitew-launch {
        --launch-duration: 1.65s;
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        grid-template-rows: 1fr auto auto auto 1fr auto;
        place-items: center;
        gap: 17px;
        padding:
          max(36px, env(safe-area-inset-top))
          24px
          max(28px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 45%, rgb(142 231 208 / 11%), transparent 24rem),
          radial-gradient(circle at 58% 51%, rgb(240 184 100 / 8%), transparent 16rem),
          linear-gradient(180deg, #020605 0%, #050a08 52%, #020403 100%);
        color: #f4f1e7;
        pointer-events: auto;
        overflow: hidden;
        animation: anitew-launch-away var(--launch-duration) cubic-bezier(.4,0,.2,1) forwards;
      }
      html[data-anitew-first-launch='true'] #anitew-launch {
        --launch-duration: 5s;
      }
      #anitew-launch::before,
      #anitew-launch::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #anitew-launch::before {
        opacity: .74;
        background-image:
          radial-gradient(circle at 12% 18%, rgb(142 231 208 / 30%) 0 1px, transparent 1.6px),
          radial-gradient(circle at 78% 16%, rgb(240 184 100 / 24%) 0 1px, transparent 1.6px),
          radial-gradient(circle at 88% 72%, rgb(142 231 208 / 23%) 0 1px, transparent 1.6px),
          radial-gradient(circle at 24% 81%, rgb(240 184 100 / 20%) 0 1px, transparent 1.6px);
        background-size: 86px 103px, 121px 97px, 143px 131px, 167px 149px;
        animation: anitew-launch-field 6.4s ease-in-out infinite alternate;
      }
      #anitew-launch::after {
        inset: -28%;
        opacity: .34;
        background:
          conic-gradient(from 12deg at 50% 48%, transparent 0 18%, rgb(142 231 208 / 6%) 23%, transparent 29% 62%, rgb(240 184 100 / 5%) 69%, transparent 76%);
        filter: blur(34px);
        animation: anitew-launch-aurora 16s ease-in-out infinite alternate;
      }
      .anitew-launch-terms {
        grid-row: 1;
        align-self: end;
        margin-bottom: 29px;
        color: rgb(188 219 207 / 68%);
        font: 650 8px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .245em;
        text-align: center;
        text-transform: uppercase;
        opacity: 0;
        animation: anitew-launch-copy .72s .12s ease forwards;
      }
      .anitew-launch-core {
        grid-row: 2;
        width: 154px;
        height: 154px;
        overflow: visible;
        filter:
          drop-shadow(0 0 18px rgb(240 184 100 / 16%))
          drop-shadow(0 0 48px rgb(142 231 208 / 10%));
      }
      .anitew-mark-path,
      .anitew-mark-branch {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 170;
        stroke-dashoffset: 170;
        vector-effect: non-scaling-stroke;
        animation: anitew-mark-draw 1.18s cubic-bezier(.16,.84,.22,1) forwards;
      }
      .anitew-mark-path {
        stroke: url(#anitew-mark-gradient);
        stroke-width: 1.55;
      }
      .anitew-mark-branch {
        stroke: rgb(142 231 208 / 58%);
        stroke-width: 1.35;
        animation-delay: .25s;
      }
      .anitew-mark-halo {
        fill: none;
        stroke: rgb(142 231 208 / 9%);
        stroke-width: .8;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: anitew-mark-halo 4.8s 1.15s ease-in-out infinite;
      }
      .anitew-mark-node {
        fill: #f0b864;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        filter: drop-shadow(0 0 5px rgb(240 184 100 / 48%));
        animation: anitew-mark-node .48s cubic-bezier(.16,.84,.22,1) forwards;
      }
      .anitew-mark-node:nth-of-type(1) { animation-delay: .34s; }
      .anitew-mark-node:nth-of-type(2) { animation-delay: .46s; }
      .anitew-mark-node:nth-of-type(3) { animation-delay: .58s; }
      .anitew-mark-node:nth-of-type(4) { animation-delay: .70s; }
      .anitew-mark-node:nth-of-type(5) { animation-delay: .82s; }
      .anitew-mark-node-branch {
        fill: #8ee7d0;
        filter: drop-shadow(0 0 5px rgb(142 231 208 / 55%));
        animation-delay: .78s !important;
      }
      .anitew-mark-signal {
        fill: #fff1c9;
        opacity: 0;
        filter: drop-shadow(0 0 5px rgb(255 225 167 / 86%));
        animation: anitew-mark-signal 2.9s 1.05s ease-in-out infinite;
      }
      .anitew-launch-name {
        grid-row: 3;
        opacity: 0;
        transform: translateY(5px);
        font: 520 21px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .46em;
        text-indent: .46em;
        text-shadow: 0 0 28px rgb(142 231 208 / 12%);
        animation: anitew-launch-name .56s .62s ease forwards;
      }
      .anitew-launch-tagline {
        grid-row: 4;
        margin-top: -6px;
        max-width: min(86vw, 420px);
        color: rgb(225 232 225 / 68%);
        font: 500 11px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .035em;
        text-align: center;
        opacity: 0;
        animation: anitew-launch-copy .58s .76s ease forwards;
      }
      .anitew-launch-powered {
        grid-row: 6;
        align-self: end;
        color: rgb(205 211 205 / 42%);
        font: 500 9px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .12em;
        opacity: 0;
        animation: anitew-launch-copy .55s .96s ease forwards;
      }
      #root .drawer-veil {
        z-index: 3000 !important;
        pointer-events: auto !important;
        isolation: isolate;
      }
      #root .drawer {
        z-index: 1 !important;
        pointer-events: auto !important;
      }
      #root .menu-group {
        z-index: 2 !important;
        pointer-events: auto !important;
      }
      #root .drawer-item {
        z-index: 3 !important;
        pointer-events: auto !important;
      }
      @keyframes anitew-mark-draw { to { stroke-dashoffset: 0; } }
      @keyframes anitew-mark-node {
        0% { opacity: 0; transform: scale(.24); }
        70% { opacity: 1; transform: scale(1.18); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes anitew-mark-halo {
        0%, 100% { opacity: .1; transform: scale(.78); }
        50% { opacity: .68; transform: scale(1.35); }
      }
      @keyframes anitew-mark-signal {
        0% { opacity: 0; offset-distance: 0%; }
        10% { opacity: .95; }
        88% { opacity: .9; }
        100% { opacity: 0; offset-distance: 100%; }
      }
      @keyframes anitew-launch-name {
        to { opacity: 1; transform: none; }
      }
      @keyframes anitew-launch-copy {
        to { opacity: 1; }
      }
      @keyframes anitew-launch-field {
        to { transform: translate3d(1.2%, -1%, 0) scale(1.02); opacity: .92; }
      }
      @keyframes anitew-launch-aurora {
        to { transform: translate3d(2%, 1.4%, 0) rotate(2deg) scale(1.04); opacity: .48; }
      }
      @keyframes anitew-launch-away {
        0%, 84% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #anitew-launch { --launch-duration: .42s; }
        html[data-anitew-first-launch='true'] #anitew-launch { --launch-duration: 5s; }
        #anitew-launch::before,
        #anitew-launch::after,
        .anitew-mark-path,
        .anitew-mark-branch,
        .anitew-mark-halo,
        .anitew-mark-node,
        .anitew-mark-signal,
        .anitew-launch-name,
        .anitew-launch-terms,
        .anitew-launch-tagline,
        .anitew-launch-powered {
          animation: none !important;
          stroke-dashoffset: 0;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="anitew-launch" aria-hidden="true">
      <div class="anitew-launch-terms">MEMORIZE · RECALL · RETAIN · MASTER</div>
      <svg class="anitew-launch-core" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="anitew-mark-gradient" x1="18" y1="84" x2="103" y2="37" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8ee7d0" stop-opacity=".54" />
            <stop offset=".48" stop-color="#b7ddbd" stop-opacity=".72" />
            <stop offset="1" stop-color="#f0b864" stop-opacity=".92" />
          </linearGradient>
        </defs>
        <!-- Das ursprüngliche ANITEW-Prinzip: Wiederholungskurve + echter Seitenzweig. -->
        <path class="anitew-mark-path" d="M24 79L36 67L54 54L78 43L100 38" />
        <path class="anitew-mark-branch" d="M54 54L67 76" />
        <circle class="anitew-mark-halo" cx="78" cy="43" r="8.5" />
        <circle class="anitew-mark-halo" cx="100" cy="38" r="10" style="animation-delay:1.65s" />
        <circle class="anitew-mark-node" cx="24" cy="79" r="3.5" />
        <circle class="anitew-mark-node" cx="36" cy="67" r="3.8" />
        <circle class="anitew-mark-node" cx="54" cy="54" r="4.2" />
        <circle class="anitew-mark-node" cx="78" cy="43" r="4.6" />
        <circle class="anitew-mark-node" cx="100" cy="38" r="5" />
        <circle class="anitew-mark-node anitew-mark-node-branch" cx="67" cy="76" r="3.2" />
        <circle
          class="anitew-mark-signal"
          r="1.65"
          style="offset-path:path('M24 79L36 67L54 54L78 43L100 38');offset-rotate:0deg"
        />
      </svg>
      <div class="anitew-launch-name">ANITEW</div>
      <div class="anitew-launch-tagline">Train the memory you actually use. Remember what matters.</div>
      <div class="anitew-launch-powered">Powered by Impekal</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
