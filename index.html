<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ANITEW</title>
    <meta
      name="description"
      content="Hol zurück, was bleiben soll. Gedächtnis ist Technik, kein Talent. Abruftraining, Wiederholungsplanung und ehrliche Messung."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1218" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ANITEW" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <script>
      /*
       * Das fünfsekündige Markenritual gehört nur zum allerersten Öffnen auf
       * diesem Gerät. Danach ist ANITEW sofort wieder ein Werkzeug. Der
       * Query-Schalter ist ausschließlich für den expliziten E2E-Vertrag;
       * normale automatisierte Browser zahlen die fünf Sekunden nicht bei
       * jedem isolierten Testkontext erneut.
       */
      try {
        const key = 'anitew.launch.seen.v3'
        const forced = new URLSearchParams(location.search).get('firstLaunch') === '1'
        const first = forced || (navigator.webdriver !== true && localStorage.getItem(key) !== '1')
        document.documentElement.dataset.anitewFirstLaunch = first ? 'true' : 'false'
        if (first && !forced) localStorage.setItem(key, '1')
      } catch {
        document.documentElement.dataset.anitewFirstLaunch = 'true'
      }
    </script>
    <style>
      #anitew-launch {
        --launch-duration: 1.65s;
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        grid-template-rows: 1fr auto auto auto 1fr;
        place-items: center;
        gap: 16px;
        padding:
          max(36px, env(safe-area-inset-top))
          24px
          max(28px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 43%, rgb(140 207 192 / 8%), transparent 27rem),
          radial-gradient(circle at 50% 50%, rgb(216 168 90 / 6%), transparent 17rem),
          linear-gradient(180deg, #030706 0%, #050a08 56%, #020403 100%);
        color: #f0eee4;
        pointer-events: auto;
        overflow: hidden;
        animation: anitew-launch-away var(--launch-duration) cubic-bezier(.4,0,.2,1) forwards;
      }
      html[data-anitew-first-launch='true'] #anitew-launch {
        --launch-duration: 5s;
      }
      #anitew-launch::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: .46;
        background-image:
          radial-gradient(circle at 18% 26%, rgb(140 207 192 / 28%) 0 1px, transparent 1.5px),
          radial-gradient(circle at 74% 18%, rgb(216 168 90 / 22%) 0 1px, transparent 1.5px),
          radial-gradient(circle at 84% 71%, rgb(140 207 192 / 20%) 0 1px, transparent 1.5px),
          radial-gradient(circle at 26% 78%, rgb(216 168 90 / 16%) 0 1px, transparent 1.5px);
        background-size: 93px 107px, 127px 101px, 149px 137px, 173px 151px;
        animation: anitew-launch-field 5.8s ease-in-out infinite alternate;
      }
      .anitew-launch-terms {
        grid-row: 1;
        align-self: end;
        margin-bottom: 26px;
        color: rgb(174 201 190 / 56%);
        font: 600 8px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .24em;
        text-align: center;
        text-transform: uppercase;
        opacity: 0;
        animation: anitew-launch-copy .72s .16s ease forwards;
      }
      .anitew-launch-core {
        grid-row: 2;
        width: 122px;
        height: 122px;
        overflow: visible;
        filter:
          drop-shadow(0 0 20px rgb(216 168 90 / 20%))
          drop-shadow(0 0 42px rgb(140 207 192 / 8%));
      }
      .anitew-logo-orbit,
      .anitew-logo-link,
      .anitew-logo-loop {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: anitew-launch-draw 920ms cubic-bezier(.16,.84,.22,1) forwards;
      }
      .anitew-logo-orbit {
        stroke: rgb(140 207 192 / 32%);
        stroke-width: 1;
      }
      .anitew-logo-orbit-b {
        stroke: rgb(216 168 90 / 34%);
        stroke-dasharray: 3 8;
        stroke-dashoffset: 0;
        animation: anitew-logo-orbit 18s linear infinite;
      }
      .anitew-logo-link {
        stroke: rgb(140 207 192 / 50%);
        stroke-width: 1.15;
        animation-delay: 90ms;
      }
      .anitew-logo-loop {
        stroke: rgb(216 168 90 / 54%);
        stroke-width: 1.2;
        animation-delay: 180ms;
      }
      .anitew-logo-node {
        fill: #8ccfc0;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: anitew-launch-point 620ms .28s cubic-bezier(.16,.84,.22,1) forwards;
      }
      .anitew-logo-node-gold { fill: #ffd990; }
      .anitew-logo-core {
        fill: #ffd990;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation:
          anitew-launch-point 620ms .38s cubic-bezier(.16,.84,.22,1) forwards,
          anitew-logo-breathe 3.6s 1.1s ease-in-out infinite;
        filter: drop-shadow(0 0 8px rgb(255 217 144 / 58%));
      }
      .anitew-launch-name {
        grid-row: 3;
        opacity: 0;
        transform: translateY(5px);
        font: 500 19px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .44em;
        text-indent: .44em;
        animation: anitew-launch-name 520ms .54s ease forwards;
      }
      .anitew-launch-powered {
        grid-row: 4;
        margin-top: 3px;
        color: rgb(205 211 205 / 34%);
        font: 500 9px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .12em;
        opacity: 0;
        animation: anitew-launch-copy .55s .78s ease forwards;
      }
      #root .drawer-veil {
        z-index: 3000 !important;
        pointer-events: auto !important;
        isolation: isolate;
      }
      #root .drawer {
        z-index: 1 !important;
        pointer-events: auto !important;
      }
      #root .menu-group {
        z-index: 2 !important;
        pointer-events: auto !important;
      }
      #root .drawer-item {
        z-index: 3 !important;
        pointer-events: auto !important;
      }
      @keyframes anitew-launch-draw { to { stroke-dashoffset: 0; } }
      @keyframes anitew-launch-point {
        0% { opacity: 0; transform: scale(.18); }
        55% { opacity: 1; transform: scale(1.42); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes anitew-launch-name {
        to { opacity: 1; transform: none; }
      }
      @keyframes anitew-launch-copy {
        to { opacity: 1; }
      }
      @keyframes anitew-logo-breathe {
        0%, 100% { transform: scale(.9); filter: drop-shadow(0 0 7px rgb(255 217 144 / 42%)); }
        50% { transform: scale(1.18); filter: drop-shadow(0 0 13px rgb(255 217 144 / 72%)); }
      }
      @keyframes anitew-logo-orbit {
        to { stroke-dashoffset: -88; }
      }
      @keyframes anitew-launch-field {
        to { transform: translate3d(1.5%, -1%, 0) scale(1.018); opacity: .62; }
      }
      @keyframes anitew-launch-away {
        0%, 84% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #anitew-launch { --launch-duration: .42s; }
        html[data-anitew-first-launch='true'] #anitew-launch { --launch-duration: 5s; }
        #anitew-launch::before,
        .anitew-logo-orbit,
        .anitew-logo-link,
        .anitew-logo-loop,
        .anitew-logo-node,
        .anitew-logo-core,
        .anitew-launch-name,
        .anitew-launch-terms,
        .anitew-launch-powered {
          animation: none !important;
          stroke-dashoffset: 0;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="anitew-launch" aria-hidden="true">
      <div class="anitew-launch-terms">ERINNERN · VERKNÜPFEN · ABRUFEN · FESTIGEN</div>
      <svg class="anitew-launch-core" viewBox="0 0 120 120" aria-hidden="true">
        <path class="anitew-logo-orbit" d="M20 66C17 39 34 18 58 16c27-2 47 17 45 44-2 25-19 43-43 44-24 1-40-13-43-34" />
        <path class="anitew-logo-orbit anitew-logo-orbit-b" d="M29 88C17 69 21 43 39 30c20-15 48-10 61 10" />
        <path class="anitew-logo-link" d="M24 78C39 72 49 64 60 57C72 49 82 42 96 31M60 57L91 82M60 57L43 25" />
        <path class="anitew-logo-loop" d="M24 78C28 95 48 101 63 91C76 82 75 66 60 57C45 48 31 56 29 68" />
        <circle class="anitew-logo-node" cx="24" cy="78" r="3.1" />
        <circle class="anitew-logo-node anitew-logo-node-gold" cx="43" cy="25" r="2.7" style="animation-delay:.36s" />
        <circle class="anitew-logo-node" cx="96" cy="31" r="3.3" style="animation-delay:.44s" />
        <circle class="anitew-logo-node" cx="91" cy="82" r="2.8" style="animation-delay:.52s" />
        <circle class="anitew-logo-core" cx="60" cy="57" r="6.2" />
      </svg>
      <div class="anitew-launch-name">ANITEW</div>
      <div class="anitew-launch-powered">Powered by Impekal</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
