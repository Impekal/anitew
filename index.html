<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ANITEW</title>
    <meta
      name="description"
      content="Hol zurück, was bleiben soll. Gedächtnis ist Technik, kein Talent. Abruftraining, Wiederholungsplanung und ehrliche Messung."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1218" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ANITEW" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <script>
      /* Theme vor dem ersten Paint anwenden. Default bleibt bewusst System. */
      try {
        const theme = localStorage.getItem('anitew.theme.v1')
        document.documentElement.dataset.anitewTheme =
          theme === 'light' || theme === 'dark' ? theme : 'system'
      } catch {
        document.documentElement.dataset.anitewTheme = 'system'
      }

      /*
       * Drei Fälle, drei Längen:
       *
       * 1. **Allererstes Öffnen auf diesem Gerät** — fünf Sekunden. Einmal im
       *    Leben darf die Marke sich Zeit nehmen.
       * 2. **Jedes weitere Öffnen** — drei Sekunden. Lang genug, dass das
       *    Ritual als Ritual erkennbar bleibt, kurz genug, dass ANITEW ein
       *    Werkzeug bleibt.
       * 3. **Die App war schon offen** — gar kein Splash. Wer nur kurz aus dem
       *    Fenster war und wieder drauftippt, startet nichts neu; ihn noch
       *    einmal drei Sekunden warten zu lassen, wäre reine Schikane.
       *
       * Fall 3 hängt an `sessionStorage`, und zwar mit Absicht: Der Marker
       * überlebt ein Neuladen innerhalb derselben Sitzung — also auch das
       * Neuladen, das iOS einer im Hintergrund liegenden PWA verordnet — und
       * verschwindet, sobald die App wirklich geschlossen wird. Genau das ist
       * die Grenze, die hier gemeint ist. Ohne `sessionStorage` (privater
       * Modus) fällt der Fall weg und es bleibt beim normalen Splash; das ist
       * die richtige Richtung zu irren.
       *
       * Der Query-Schalter ist ausschließlich für den expliziten E2E-Vertrag;
       * normale automatisierte Browser zahlen die fünf Sekunden nicht bei
       * jedem isolierten Testkontext erneut. Er sticht auch Fall 3, sonst
       * könnte ein Test das Ritual nicht zweimal prüfen.
       */
      try {
        const key = 'anitew.launch.seen.v3'
        const openKey = 'anitew.launch.open.v1'
        const forced = new URLSearchParams(location.search).get('firstLaunch') === '1'

        let resumed = false
        try {
          resumed = !forced && sessionStorage.getItem(openKey) === '1'
          sessionStorage.setItem(openKey, '1')
        } catch {
          // Ohne Sitzungsspeicher gibt es Fall 3 nicht. Kein Grund zu scheitern.
        }

        const first = forced || (navigator.webdriver !== true && localStorage.getItem(key) !== '1')
        document.documentElement.dataset.anitewFirstLaunch = first ? 'true' : 'false'
        document.documentElement.dataset.anitewLaunch = resumed ? 'skip' : 'show'
        if (first && !forced) localStorage.setItem(key, '1')
      } catch {
        document.documentElement.dataset.anitewFirstLaunch = 'true'
        document.documentElement.dataset.anitewLaunch = 'show'
      }
    </script>
    <style>
      /*
       * Splash = Marke, nicht Oberfläche. Deshalb ist seine Sprache immer
       * Englisch und unabhängig von Geräte-, App- und Trainingssprache.
       *
       * Die Choreografie erzählt das Produktprinzip: ein schwacher Abrufpfad
       * wird sichtbar, verdichtet sich über mehrere Knoten und sendet am Ende
       * ein Signal zurück. Keine UI, kein Ladeindikator — ein kurzes Ritual.
       */
      /*
       * Die App war schon offen — dann gibt es nichts zu eröffnen. `display:
       * none` und nicht bloß durchsichtig: Ein Element mit z-index 99999 über
       * der ganzen Oberfläche soll gar nicht erst da sein.
       */
      html[data-anitew-launch='skip'] #anitew-launch {
        display: none;
      }

      #anitew-launch {
        --launch-duration: 3s;
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        /*
         * Sechs Zeilen, zwei davon dehnbar: Name und Satz stehen zwischen den
         * beiden `1fr` in der Mitte, die Herkunftszeile sitzt in der letzten
         * Zeile am Fuß — wie die Signatur am Fuß der Bibliothek in RReader.
         * Eine Signatur gehört ans Ende, nicht an den Text.
         */
        grid-template-rows: 1fr auto auto auto 1fr auto;
        place-items: center;
        gap: 15px;
        padding:
          max(38px, env(safe-area-inset-top))
          24px
          max(30px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse at 50% 47%, rgb(142 231 208 / 13%) 0, rgb(142 231 208 / 4%) 26%, transparent 56%),
          radial-gradient(circle at 61% 44%, rgb(240 184 100 / 9%) 0, transparent 32%),
          radial-gradient(circle at 48% 80%, rgb(44 111 91 / 8%) 0, transparent 35%),
          linear-gradient(180deg, #010403 0%, #030806 47%, #010302 100%);
        color: #f4f1e7;
        pointer-events: auto;
        overflow: hidden;
        isolation: isolate;
        animation: anitew-launch-away var(--launch-duration) cubic-bezier(.4,0,.2,1) forwards;
      }
      html[data-anitew-first-launch='true'] #anitew-launch {
        --launch-duration: 5s;
      }
      #anitew-launch::before,
      #anitew-launch::after {
        content: '';
        position: absolute;
        pointer-events: none;
      }
      #anitew-launch::before {
        inset: -12%;
        z-index: -2;
        opacity: .68;
        background-image:
          radial-gradient(circle at 12% 18%, rgb(142 231 208 / 36%) 0 .8px, transparent 1.5px),
          radial-gradient(circle at 78% 16%, rgb(240 184 100 / 27%) 0 .8px, transparent 1.5px),
          radial-gradient(circle at 88% 72%, rgb(142 231 208 / 25%) 0 .8px, transparent 1.5px),
          radial-gradient(circle at 24% 81%, rgb(240 184 100 / 22%) 0 .8px, transparent 1.5px),
          linear-gradient(rgb(142 231 208 / 2.8%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(142 231 208 / 2.3%) 1px, transparent 1px);
        background-size:
          86px 103px,
          121px 97px,
          143px 131px,
          167px 149px,
          56px 56px,
          56px 56px;
        mask-image: radial-gradient(ellipse at center, black 0 34%, rgb(0 0 0 / 70%) 52%, transparent 78%);
        animation: anitew-launch-field 6.4s ease-in-out infinite alternate;
      }
      #anitew-launch::after {
        inset: -35%;
        z-index: -1;
        opacity: .32;
        background:
          conic-gradient(
            from 10deg at 50% 48%,
            transparent 0 17%,
            rgb(142 231 208 / 8%) 22%,
            transparent 29% 61%,
            rgb(240 184 100 / 6%) 68%,
            transparent 76%
          );
        filter: blur(42px);
        animation: anitew-launch-aurora 14s ease-in-out infinite alternate;
      }
      /*
       * Die vier Wörter sind die Kopfzeile der Marke — sie gehören nach oben
       * und nicht knapp über das Zeichen. `align-self: start` setzt sie an
       * den Anfang der dehnbaren ersten Zeile, also direkt unter den oberen
       * Sicherheitsrand.
       *
       * Farbe aus der Signature-Palette: Gold (`--wow-gold`, #e5b86d) gegen
       * das Mint des Slogans. Das ist dasselbe Paar, das der Marke im Zeichen
       * schon zugrunde liegt — die Knoten laufen von Mint nach Gold. Das
       * bisherige kühle Grau (rgb(195 224 214 / 62%)) stand in keiner der
       * beiden Reihen.
       */
      .anitew-launch-terms {
        grid-row: 1;
        align-self: start;
        /*
         * Nicht ganz an den Rand: `align-self: start` setzte die Zeile direkt
         * unter den Sicherheitsabstand, und das sah geklebt aus statt gesetzt.
         */
        margin-top: 34px;
        margin-bottom: 0;
        color: rgb(229 184 109 / 78%);
        text-shadow: 0 0 18px rgb(229 184 109 / 22%);
        font: 650 10px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .27em;
        text-align: center;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(4px);
        text-shadow: 0 0 18px rgb(142 231 208 / 10%);
        animation: anitew-launch-copy .7s .08s ease forwards;
      }
      .anitew-launch-core {
        grid-row: 2;
        width: clamp(164px, 22vw, 182px);
        height: clamp(164px, 22vw, 182px);
        overflow: visible;
        filter:
          drop-shadow(0 0 16px rgb(240 184 100 / 18%))
          drop-shadow(0 0 44px rgb(142 231 208 / 13%))
          drop-shadow(0 0 90px rgb(142 231 208 / 5%));
        transform-origin: 50% 50%;
        animation: anitew-core-arrive .85s cubic-bezier(.16,.84,.22,1) both;
      }
      .anitew-mark-path,
      .anitew-mark-branch {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 170;
        stroke-dashoffset: 170;
        vector-effect: non-scaling-stroke;
        animation: anitew-mark-draw 1.24s cubic-bezier(.16,.84,.22,1) forwards;
      }
      .anitew-mark-path {
        stroke: url(#anitew-mark-gradient);
        stroke-width: 1.65;
      }
      .anitew-mark-branch {
        stroke: rgb(142 231 208 / 56%);
        stroke-width: 1.32;
        animation-delay: .22s;
      }
      .anitew-mark-halo {
        fill: none;
        stroke: rgb(142 231 208 / 12%);
        stroke-width: .75;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: anitew-mark-halo 3.8s 1.02s ease-in-out infinite;
      }
      .anitew-mark-node {
        fill: #f0b864;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        filter: drop-shadow(0 0 6px rgb(240 184 100 / 58%));
        animation: anitew-mark-node .48s cubic-bezier(.16,.84,.22,1) forwards;
      }
      /* Die zwei Halo-Kreise stehen im SVG vor den fünf Hauptknoten. */
      .anitew-mark-node:nth-of-type(3) { animation-delay: .28s; }
      .anitew-mark-node:nth-of-type(4) { animation-delay: .40s; }
      .anitew-mark-node:nth-of-type(5) { animation-delay: .52s; }
      .anitew-mark-node:nth-of-type(6) { animation-delay: .64s; }
      .anitew-mark-node:nth-of-type(7) { animation-delay: .76s; }
      .anitew-mark-node-branch {
        fill: #8ee7d0;
        filter: drop-shadow(0 0 6px rgb(142 231 208 / 62%));
        animation-delay: .72s !important;
      }
      .anitew-mark-signal {
        fill: #fff4d6;
        opacity: 0;
        filter:
          drop-shadow(0 0 4px rgb(255 225 167 / 95%))
          drop-shadow(0 0 9px rgb(142 231 208 / 45%));
        animation: anitew-mark-signal 2.75s .92s cubic-bezier(.4,0,.2,1) infinite;
      }
      .anitew-launch-name {
        grid-row: 3;
        opacity: 0;
        transform: translateY(7px) scale(.985);
        font: 520 22px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .49em;
        text-indent: .49em;
        text-shadow:
          0 0 25px rgb(142 231 208 / 15%),
          0 0 60px rgb(240 184 100 / 5%);
        animation: anitew-launch-name .62s .56s cubic-bezier(.16,.84,.22,1) forwards;
      }
      /*
       * Der Satz, der sagt, worum es geht — direkt über der Herkunftszeile.
       *
       * Er steht bewusst **zwischen** Name und „Powered by Impekal“: größer
       * und in Mint statt Grau, damit er als Aussage gelesen wird und nicht
       * als Kleingedrucktes. Die Herkunftszeile bleibt, was sie war — klein,
       * grau, ganz unten.
       */
      .anitew-launch-slogan {
        grid-row: 4;
        margin-top: 15px;
        /*
         * Ein Satz, möglichst auf einer Zeile. `ch` war hier falsch: 25
         * Zeichenbreiten sind bei 13 px rund 150 px — schmaler als der
         * Schriftzug darüber, und der Satz fiel in kurze Stummel.
         */
        max-width: min(340px, 84vw);
        color: rgb(142 231 208 / 82%);
        font: 460 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .035em;
        text-align: center;
        text-shadow: 0 0 22px rgb(142 231 208 / 18%);
        opacity: 0;
        transform: translateY(4px);
        animation: anitew-launch-copy .6s .76s ease forwards;
      }
      .anitew-launch-powered {
        grid-row: 6;
        align-self: end;
        /* Am Fuß, aber nicht auf der Kante — dieselbe Überlegung wie oben. */
        margin-top: 0;
        margin-bottom: 30px;
        color: rgb(158 230 210 / 38%);
        font: 500 9px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: .13em;
        opacity: 0;
        transform: translateY(3px);
        animation: anitew-launch-copy .54s 1.04s ease forwards;
      }
      #root .drawer-veil {
        z-index: 3000 !important;
        pointer-events: auto !important;
        isolation: isolate;
      }
      #root .drawer {
        z-index: 1 !important;
        pointer-events: auto !important;
      }
      #root .menu-group {
        z-index: 2 !important;
        pointer-events: auto !important;
      }
      #root .drawer-item {
        z-index: 3 !important;
        pointer-events: auto !important;
      }
      @keyframes anitew-core-arrive {
        0% { opacity: 0; transform: scale(.88); }
        58% { opacity: 1; }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes anitew-mark-draw {
        0% { stroke-dashoffset: 170; opacity: .2; }
        20% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes anitew-mark-node {
        0% { opacity: 0; transform: scale(.18); }
        68% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes anitew-mark-halo {
        0%, 100% { opacity: .08; transform: scale(.72); }
        48% { opacity: .74; transform: scale(1.42); }
        70% { opacity: .2; transform: scale(1.58); }
      }
      @keyframes anitew-mark-signal {
        0% { opacity: 0; offset-distance: 0%; transform: scale(.7); }
        9% { opacity: 1; transform: scale(1); }
        82% { opacity: .96; transform: scale(1); }
        100% { opacity: 0; offset-distance: 100%; transform: scale(.62); }
      }
      @keyframes anitew-launch-name {
        to { opacity: 1; transform: none; }
      }
      @keyframes anitew-launch-copy {
        to { opacity: 1; transform: none; }
      }
      @keyframes anitew-launch-field {
        to { transform: translate3d(1.5%, -1.2%, 0) scale(1.025); opacity: .9; }
      }
      @keyframes anitew-launch-aurora {
        to { transform: translate3d(2.4%, 1.6%, 0) rotate(2.4deg) scale(1.05); opacity: .46; }
      }
      @keyframes anitew-launch-away {
        0%, 82% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      @media (max-width: 430px) {
        .anitew-launch-terms {
          font-size: 9px;
          letter-spacing: .21em;
        }
        .anitew-launch-name {
          font-size: 21px;
          letter-spacing: .45em;
          text-indent: .45em;
        }
        .anitew-launch-slogan {
          margin-top: 13px;
          max-width: min(330px, 86vw);
          font-size: 12.5px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #anitew-launch { --launch-duration: .42s; }
        html[data-anitew-first-launch='true'] #anitew-launch { --launch-duration: 5s; }
        #anitew-launch::before,
        #anitew-launch::after,
        .anitew-launch-core,
        .anitew-mark-path,
        .anitew-mark-branch,
        .anitew-mark-halo,
        .anitew-mark-node,
        .anitew-mark-signal,
        .anitew-launch-name,
        .anitew-launch-terms,
        .anitew-launch-slogan,
        .anitew-launch-powered {
          animation: none !important;
          stroke-dashoffset: 0;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="anitew-launch" aria-hidden="true">
      <div class="anitew-launch-terms">MEMORIZE · RECALL · RETAIN · MASTER</div>
      <svg class="anitew-launch-core" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="anitew-mark-gradient" x1="18" y1="84" x2="103" y2="37" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8ee7d0" stop-opacity=".50" />
            <stop offset=".46" stop-color="#b7ddbd" stop-opacity=".76" />
            <stop offset="1" stop-color="#f0b864" stop-opacity=".96" />
          </linearGradient>
        </defs>
        <!-- Das ursprüngliche ANITEW-Prinzip: Wiederholungskurve + echter Seitenzweig. -->
        <path class="anitew-mark-path" d="M24 79L36 67L54 54L78 43L100 38" />
        <path class="anitew-mark-branch" d="M54 54L67 76" />
        <circle class="anitew-mark-halo" cx="78" cy="43" r="8.5" />
        <circle class="anitew-mark-halo" cx="100" cy="38" r="10" style="animation-delay:1.48s" />
        <circle class="anitew-mark-node" cx="24" cy="79" r="3.5" />
        <circle class="anitew-mark-node" cx="36" cy="67" r="3.8" />
        <circle class="anitew-mark-node" cx="54" cy="54" r="4.2" />
        <circle class="anitew-mark-node" cx="78" cy="43" r="4.6" />
        <circle class="anitew-mark-node" cx="100" cy="38" r="5" />
        <circle class="anitew-mark-node anitew-mark-node-branch" cx="67" cy="76" r="3.2" />
        <circle
          class="anitew-mark-signal"
          r="1.7"
          style="offset-path:path('M24 79L36 67L54 54L78 43L100 38');offset-rotate:0deg"
        />
      </svg>
      <div class="anitew-launch-name">ANITEW</div>
      <div class="anitew-launch-slogan">Train the memory you actually use.</div>
      <div class="anitew-launch-powered">Powered by Impekal</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
