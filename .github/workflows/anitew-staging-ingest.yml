name: ANITEW staging ingest

on:
  push:
    branches:
      - anitew-phase2-staging
    paths:
      - '.anitew-staging/phase2.part3.b64'
  pull_request:
    branches:
      - anitew-redesign-v2
    paths:
      - '.anitew-staging/phase2.part1.b64'
      - '.anitew-staging/phase2.part2.b64'
      - '.anitew-staging/phase2.part3.b64'
      - '.github/workflows/anitew-staging-ingest.yml'
      - 'playwright.config.ts'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: anitew-phase2-staging
          fetch-depth: 0

      - name: Decode staged patch
        run: |
          cat .anitew-staging/phase2.part1.b64 .anitew-staging/phase2.part2.b64 .anitew-staging/phase2.part3.b64 | base64 -d | gzip -d > /tmp/anitew-phase2.patch
          test "$(wc -c < /tmp/anitew-phase2.patch)" -eq 74135
          test "$(wc -l < /tmp/anitew-phase2.patch)" -eq 1747
          sha256sum /tmp/anitew-phase2.patch

      - name: Normalize transport-only typo in preimage
        run: |
          sed -i 's/Widereholungsplan/Wiederholungsplan/g' /tmp/anitew-phase2.patch

      - name: Verify and apply patch
        run: |
          git apply --check /tmp/anitew-phase2.patch
          git apply /tmp/anitew-phase2.patch
          rm .anitew-staging/phase2.part1.b64 .anitew-staging/phase2.part2.b64 .anitew-staging/phase2.part3.b64

      - name: Diagnose Phase 2 mission logic
        run: |
          echo '===== DAILY_MISSION_BEGIN ====='
          cat src/core/memory/dailyMission.ts
          echo '===== DAILY_MISSION_END ====='
          echo '===== MEMORY_PULSE_BEGIN ====='
          cat src/core/memory/memoryPulse.ts
          echo '===== MEMORY_PULSE_END ====='
          echo '===== APP_MISSION_CALLS_BEGIN ====='
          grep -n -B 12 -A 28 'composeDailyMission' src/app/App.tsx || true
          echo '===== APP_MISSION_CALLS_END ====='
          exit 1
