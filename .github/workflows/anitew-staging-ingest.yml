name: ANITEW staging ingest

on:
  push:
    branches:
      - anitew-phase2-staging
    paths:
      - '.anitew-staging/phase2.part3.b64'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: anitew-phase2-staging
          fetch-depth: 0

      - name: Decode staged patch
        run: |
          cat .anitew-staging/phase2.part1.b64 .anitew-staging/phase2.part2.b64 .anitew-staging/phase2.part3.b64 | base64 -d | gzip -d > /tmp/anitew-phase2.patch
          test "$(wc -c < /tmp/anitew-phase2.patch)" -eq 74135
          test "$(wc -l < /tmp/anitew-phase2.patch)" -eq 1747
          sha256sum /tmp/anitew-phase2.patch

      - name: Verify and apply patch
        run: |
          git apply --check /tmp/anitew-phase2.patch
          git apply /tmp/anitew-phase2.patch
          rm .anitew-staging/phase2.part1.b64 .anitew-staging/phase2.part2.b64 .anitew-staging/phase2.part3.b64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Size budget
        run: npm run size

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test --project=chromium

      - name: Commit validated Phase 2
        run: |
          git config user.name "ANITEW Staging Runner"
          git config user.email "actions@users.noreply.github.com"
          git diff --name-only -z --diff-filter=ACMRTUXB | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          git add -u -- .anitew-staging/phase2.part1.b64 .anitew-staging/phase2.part2.b64 .anitew-staging/phase2.part3.b64
          git diff --cached --check
          git commit -m "feat: stage ANITEW memory system phase two"
          git push origin HEAD:anitew-phase2-staging
