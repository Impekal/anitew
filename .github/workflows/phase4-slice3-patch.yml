name: Phase 4 Slice 3 patch

on:
  push:
    branches: [anitew-phase4-slice3]
    paths: [.github/workflows/phase4-slice3-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anitew-phase4-slice3
      - name: Patch the factual landing trigger
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/session/useSessionRunner.ts')
          text = path.read_text()
          old = """      if (block.moduleId === 'memory') {\n        platform.sound.play('recall')\n        void applyMemoryOutcome({ correct: graded.correct, missed: graded.missed }, at).catch(\n          () => undefined,\n        )\n      }\n"""
          new = """      if (block.moduleId === 'memory') {\n        // Ein aufgelöster Abruf klingt neutral. Nur wenn tatsächlich mindestens\n        // eine persönliche Erinnerung wiedergekommen ist, folgt ANITEWs\n        // Signature-Landing. Kein Treffer = kein Erfolgsfeedback.\n        platform.sound.play('recall')\n        if (graded.correct.length > 0) platform.sound.play('landing')\n        void applyMemoryOutcome({ correct: graded.correct, missed: graded.missed }, at).catch(\n          () => undefined,\n        )\n      }\n"""
          if old not in text:
              raise SystemExit('expected memory recall block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/phase4-slice3-patch.yml
      - name: Commit minimal runner change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/session/useSessionRunner.ts .github/workflows/phase4-slice3-patch.yml
          git commit -m "Trigger signature landing only on factual personal recall"
          git push origin HEAD:anitew-phase4-slice3
