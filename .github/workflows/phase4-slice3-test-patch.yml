name: Phase 4 Slice 3 test patch

on:
  push:
    branches: [anitew-phase4-slice3]
    paths: [.github/workflows/phase4-slice3-test-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anitew-phase4-slice3
      - name: Guard factual landing in the real memory flow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/memory.spec.ts')
          text = path.read_text()
          old = """  // Alle drei zählen — die Zusammenfassung sagt es ehrlich.\n  await expect(page.locator('.summary-score strong')).toHaveText('3', { timeout: 60_000 })\n"""
          new = """  // Der echte persönliche Treffer bekommt genau ANITEWs kurzen Landing-Moment.\n  // Er trägt sich bis in die Summary, falls der letzte Treffer die Runde beendet.\n  await expect(page.locator('.summary-memory-landing')).toBeVisible({ timeout: 2_000 })\n\n  // Alle drei zählen — die Zusammenfassung sagt es ehrlich.\n  await expect(page.locator('.summary-score strong')).toHaveText('3', { timeout: 60_000 })\n"""
          if old not in text:
              raise SystemExit('memory E2E insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/phase4-slice3-test-patch.yml
      - name: Commit landing E2E guard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/memory.spec.ts .github/workflows/phase4-slice3-test-patch.yml
          git commit -m "Guard the factual memory landing in browser tests"
          git push origin HEAD:anitew-phase4-slice3
