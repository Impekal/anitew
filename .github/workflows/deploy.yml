# Veröffentlicht die App bei Cloudflare Workers (statische Dateien).
#
# Nötig ist **eine** Angabe im Repo unter Settings → Secrets and variables:
#   CLOUDFLARE_API_TOKEN — Cloudflare → My Profile → API Tokens,
#                          Vorlage „Edit Cloudflare Workers“
#
# Die Account ID steht unten fest im Klartext. Sie ist kein Geheimnis, sondern
# eine Kennung: Ohne Token lässt sich mit ihr nichts anfangen, und im
# Schwesterprojekt RReader steht sie aus demselben Grund ebenso offen. Ein
# Secret daraus zu machen hieße nur, sie beim nächsten Mal wieder suchen zu
# müssen. Ein Secret oder eine Variable gleichen Namens sticht sie trotzdem —
# falls einmal ein anderes Konto gemeint ist.
#
# Fehlt das Token, überspringt der Lauf die Veröffentlichung still, statt rot
# zu werden — solange niemand deployen will, ist das kein Fehler.
name: Deploy

on:
  push:
    branches:
      - main
      # Der Zweig, an dem gerade gearbeitet wird. Ohne ihn bleibt die
      # Live-Fassung stumm auf dem letzten Stand, während auf dem Telefon die
      # Vergangenheit getestet wird.
      - anitew-redesign-v2
  workflow_dispatch:

# Zwei Veröffentlichungen dürfen sich nie überholen.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '07613ddfc3f70bf92e9df8a9f9530552' }}
      # Die Google-Client-Kennung für den Drive-Abgleich (D-033). Wie die
      # Account-ID ist sie **kein** Geheimnis, sondern eine Kennung: Sie
      # steht ohnehin im ausgelieferten JavaScript jeder Web-App, und Google
      # akzeptiert sie nur von den eingetragenen JavaScript-Quellen. Ein
      # Secret oder eine Variable gleichen Namens sticht sie trotzdem.
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '360791045103-jvbjtv7mdatp4f5svtcfj7uabjm7jdok.apps.googleusercontent.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Veröffentlichen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Hinweis, wenn kein Token hinterlegt ist
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Kein CLOUDFLARE_API_TOKEN hinterlegt — gebaut, aber nicht veröffentlicht."
