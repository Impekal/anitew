# Prüft jeden Push und jeden Pull Request (Backlog P3).
#
# Der Kern wird zweimal übersetzt: einmal als Teil der App, einmal für sich
# allein ohne DOM. Der zweite Durchgang ist die Durchsetzung von D-010 — wer in
# src/core/ nach `window` greift, scheitert hier und nicht erst beim Verpacken
# für die Stores.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Ein neuer Commit macht den alten CI-Stand desselben Branches wertlos.
# `head_ref` ist beim PR der Quellbranch, `ref_name` beim Push derselbe Name:
# Push und PR konkurrieren deshalb absichtlich in EINER Gruppe statt die
# 15-Minuten-Browsersuite doppelt zu rechnen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The official browser WASI asset package intentionally declares cpu=wasm32.
      # `--force` is required only so npm materializes that static asset on the
      # x64 CI host; Vite ships it to the browser and never executes it on x64.
      - run: npm ci --force
      - name: Typen prüfen (App und Kern getrennt)
        run: npm run typecheck
      - name: Tests (Kern, ohne Browser)
        run: npm test
      - name: Build
        run: npm run build
      - name: Kaltstart-Budget (P4)
        run: npm run size
      - name: Browser für die E2E-Tests
        run: npx playwright install --with-deps chromium
      - name: Tests (die gebaute App im Browser)
        run: npx playwright test --project=chromium
