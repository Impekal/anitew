# Prüft jeden Push und jeden Pull Request (Backlog P3).
#
# Der Kern wird zweimal übersetzt: einmal als Teil der App, einmal für sich
# allein ohne DOM. Der zweite Durchgang ist die Durchsetzung von D-010 — wer in
# src/core/ nach `window` greift, scheitert hier und nicht erst beim Verpacken
# für die Stores.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Ein neuer Commit macht den alten CI-Stand desselben Branches wertlos.
# `head_ref` ist beim PR der Quellbranch, `ref_name` beim Push derselbe Name:
# Push und PR konkurrieren deshalb absichtlich in EINER Gruppe statt die
# Browsersuite doppelt zu rechnen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The official browser WASI asset package intentionally declares cpu=wasm32.
      # `--force` is required only so npm materializes that static asset on the
      # x64 CI host; Vite ships it to the browser and never executes it on x64.
      - run: npm ci --force
      - name: Typen prüfen (App und Kern getrennt)
        run: npm run typecheck
      - name: Tests (Kern, ohne Browser)
        run: npm test
      - name: Build
        run: npm run build
      - name: Kaltstart-Budget (P4)
        run: npm run size
      - name: Browser für die E2E-Tests
        run: npx playwright install --with-deps chromium
      # Die bekannten Problemklassen laufen zuerst. So kostet ein kleiner
      # Regression-Fix nicht wieder den gesamten Browserlauf, bevor derselbe
      # Fehler sichtbar wird. Das Voll-Gate darunter bleibt unverändert.
      - name: E2E-Regressions-Smoke
        run: >-
          npx playwright test --project=chromium
          tests/e2e/achievements.spec.ts
          tests/e2e/palace.spec.ts
          tests/e2e/technique.spec.ts
          tests/e2e/livingInterface.spec.ts
          --grep "nennt eine Tatsache|erklärt den Palast|unterrichtet die Technik und lässt sie sofort anwenden|keinen horizontalen iPhone-Overflow"
      - name: Vollregression Desktop-Chromium
        run: npx playwright test --project=chromium
      # Releasekritische Telefonpfade werden zusätzlich auf dem Pixel-7-Profil
      # gefahren. Das ist bewusst kein Ersatz für echtes Safari/iPhone, deckt
      # aber OAuth/PWA/Offline, Datenmigration, Resilience und die komplette
      # Session-Interaktion in einer echten mobilen Viewport-/Touch-Konfiguration ab.
      - name: Mobile Release Gate
        run: >-
          npx playwright test --project=mobile
          tests/e2e/accessibility.spec.ts
          tests/e2e/install.spec.ts
          tests/e2e/livingInterface.spec.ts
          tests/e2e/memory.spec.ts
          tests/e2e/offlineFirstLaunch.spec.ts
          tests/e2e/resilience.spec.ts
          tests/e2e/session.spec.ts
          tests/e2e/sync.spec.ts
          tests/e2e/upgrade.spec.ts
      # Die schnelle Layoutsuite fährt alle sieben Profile aus playwright.config.ts:
      # iPhone SE, randloses iPhone, iPad hoch/quer, Android-Tablet sowie zwei
      # Desktopbreiten. Safari-Engine-Eigenheiten bleiben echter Hardware vorbehalten.
      - name: Layout-Matrix
        run: npx playwright test tests/e2e/layout.spec.ts
