# Prüft jeden Push und jeden Pull Request (Backlog P3).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --force
      - name: Typen prüfen (App und Kern getrennt)
        run: npm run typecheck
      - name: Tests (Kern, ohne Browser)
        run: npm test
      - name: Build
        run: npm run build
      - name: Worker und Web-Push-Konfiguration
        run: |
          node --check worker/index.js
          node --check public/push-sw.js
          node --check scripts/configure-push.mjs
          npx wrangler deploy --dry-run --outdir .wrangler-dry
      - name: Kaltstart-Budget (P4)
        run: npm run size
      - name: Browser für die E2E-Tests
        run: npx playwright install --with-deps chromium
      - name: E2E-Regressions-Smoke
        run: >-
          npx playwright test --project=chromium
          tests/e2e/achievements.spec.ts
          tests/e2e/palace.spec.ts
          tests/e2e/technique.spec.ts
          tests/e2e/livingInterface.spec.ts
          --grep "nennt eine Tatsache|erklärt den Palast|unterrichtet die Technik und lässt sie sofort anwenden|zeigt nichts an, solange nichts gelehrt ist|keinen horizontalen iPhone-Overflow"
      # Die zuletzt auf echter Hardware gefundenen Releasepfade laufen früh:
      # OAuth-Resume, vollständiger Reset, Core-Elternnavigation und Web Push.
      - name: V4.2 OAuth, Reset, Core und Push
        run: >-
          npx playwright test --project=chromium
          tests/e2e/oauthResume.spec.ts
          tests/e2e/reset.spec.ts
          tests/e2e/coreNavigation.spec.ts
          tests/e2e/reminders.spec.ts
          tests/e2e/privacy.spec.ts
      # Core-Unterseiten öffnen/schließen animiert. Diese vier Pfade hatten in
      # der langen Desktop-Suite alte Annahmen über "Zurück = Start" bzw. den
      # früheren Reset-Endzustand. Sie laufen deshalb vor der 141er Suite.
      - name: V4.2 Core-Übergänge und Reset-Endzustand
        run: >-
          npx playwright test --project=chromium
          tests/e2e/memory.spec.ts
          tests/e2e/profile.spec.ts
          tests/e2e/resilience.spec.ts
          --grep "merkt echte Information|trainiert die Erinnerung in der Einheit|schlägt mit KI vor|behält einen räumlichen Schwerpunkt|löscht auf Wunsch alles"
      - name: Layout-Matrix
        run: npx playwright test tests/e2e/layout.spec.ts
      - name: Vollregression Desktop-Chromium
        run: npx playwright test --project=chromium
      - name: Mobile Release Gate
        run: >-
          npx playwright test --project=mobile
          tests/e2e/accessibility.spec.ts
          tests/e2e/install.spec.ts
          tests/e2e/livingInterface.spec.ts
          tests/e2e/memory.spec.ts
          tests/e2e/offlineFirstLaunch.spec.ts
          tests/e2e/resilience.spec.ts
          tests/e2e/session.spec.ts
          tests/e2e/sync.spec.ts
          tests/e2e/oauthResume.spec.ts
          tests/e2e/reset.spec.ts
          tests/e2e/coreNavigation.spec.ts
          tests/e2e/reminders.spec.ts
          tests/e2e/privacy.spec.ts
          tests/e2e/upgrade.spec.ts

  # F-12 (Runde 2): Die Veröffentlichung hängt am vollen Tor desselben
  # Commits — `needs: check` lässt sie erst laufen, wenn Typen, Tests,
  # Budget und die komplette E2E-Matrix grün sind. Vorher lief der Deploy
  # als eigener Workflow **parallel** zur CI; ein Commit konnte live sein
  # und erst danach rot werden. deploy.yml bleibt nur als manueller Notweg.
  deploy:
    needs: check
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'anitew-redesign-v2')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '07613ddfc3f70bf92e9df8a9f9530552' }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '360791045103-jvbjtv7mdatp4f5svtcfj7uabjm7jdok.apps.googleusercontent.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --force
      - run: npm run build
      # Web Push darf nicht davon abhängen, dass die drei VAPID-Secrets
      # irgendwann einmal manuell gesetzt wurden (siehe deploy.yml).
      - name: Web-Push-Schlüssel sicherstellen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/configure-push.mjs
      - name: Veröffentlichen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      # Ein grüner Build beweist keine reale Push-Konfiguration.
      - name: Production Web Push prüfen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://anitew.impekaltech.workers.dev/push/vapid-public'
          const response = await fetch(url, { cache: 'no-store' })
          const body = await response.json().catch(() => ({}))
          if (!response.ok || typeof body.publicKey !== 'string' || body.publicKey.length < 40) {
            throw new Error(`Production Web Push ist nicht konfiguriert (HTTP ${response.status}).`)
          }
          console.log('Production Web Push ist konfiguriert.')
          NODE
      - name: Hinweis, wenn kein Token hinterlegt ist
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Kein CLOUDFLARE_API_TOKEN hinterlegt — gebaut, aber nicht veröffentlicht."
