# Prüft jeden Push und jeden Pull Request (Backlog P3).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Der Ereignistyp gehört in die Gruppe, sonst blockiert sie jeden Merge.
#
# Ein Push auf einen Zweig mit offenem PR löst **zwei** Läufe aus: einen für
# `push`, einen für `pull_request`. Ohne den Ereignistyp ergeben beide denselben
# Gruppennamen — `github.head_ref` beim PR und `github.ref_name` beim Push sind
# derselbe Zweig — und `cancel-in-progress` bricht den einen zugunsten des
# anderen ab. Beide schreiben aber ein `check` auf denselben Commit, und die
# Branch-Protection sieht dann das abgebrochene: „2 of 2 required status checks
# are cancelled." Der Merge geht nicht, obwohl der Gate grün ist (erlebt an
# PR #87).
#
# Getrennte Gruppen kosten auf PR-Zweigen die doppelte Laufzeit. Der Anspruch
# aus Backlog P3 — **jeder** Push wird geprüft — bleibt dafür unangetastet; ihn
# zu beschneiden wäre der billigere, aber falsche Weg.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Warum das Tor in Jobs zerfällt statt in Schritte
#
# Vorher war alles **ein** Job mit sechzehn Schritten auf **einer** Maschine,
# nacheinander. Gemessen am letzten grünen Lauf (#1386): 52 Minuten, davon
# 34,8 für die Desktop-Vollregression und 7,2 für das Mobile-Tor — 81 % der
# Zeit in zwei Schritten, die nichts voneinander wissen.
#
# `workers: 1` in der Playwright-Konfiguration bleibt unangetastet, und zwar
# aus dem dort beschriebenen Grund: Mehrere Arbeiter auf **derselben** Maschine
# nehmen den Tests die Rechenzeit weg, die eine echte Minute absitzen, und
# machen sie grundlos rot. Eine Aufteilung auf **mehrere Maschinen** hat dieses
# Problem nicht — jeder Scherben bekommt eine eigene Maschine für sich allein
# und fährt dort weiterhin mit genau einem Arbeiter.
#
# Es werden dieselben Tests ausgeführt wie vorher, in derselben Anzahl. Der
# Job `zaehlung` rechnet das nach, damit ein verrutschter Scherbenschnitt nicht
# stillschweigend Tests verschluckt: Wer schneller grün wird, indem er weniger
# prüft, hat nichts gewonnen.
# ---------------------------------------------------------------------------

jobs:
  # Alles, was ohne Browser auskommt — und der Build, den alle Scherben teilen.
  fundament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --force
      - name: Typen prüfen (App und Kern getrennt)
        run: npm run typecheck
      - name: Tests (Kern, ohne Browser)
        run: npm test
      - name: Build
        run: npm run build
      - name: Worker und Web-Push-Konfiguration
        run: |
          node --check worker/index.js
          node --check public/push-sw.js
          node --check scripts/configure-push.mjs
          npx wrangler deploy --dry-run --outdir .wrangler-dry
      - name: Kaltstart-Budget (P4)
        run: npm run size
      # Alle E2E-Jobs prüfen denselben Build, nicht je einen eigenen. Das spart
      # nicht nur Zeit — es schließt aus, dass Scherbe 3 etwas anderes prüft
      # als Scherbe 1.
      - name: Gebauten Stand weiterreichen
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    needs: fundament
    runs-on: ubuntu-latest
    strategy:
      # Kein Abbruch der Geschwister: Ein roter Scherben soll den Bericht der
      # anderen nicht verschlucken. Ein abgebrochener Lauf ist außerdem für die
      # Branch-Protection kein Fehlschlag, sondern „cancelled" — genau die
      # Falle aus PR #87.
      fail-fast: false
      matrix:
        include:
          - name: Desktop-Chromium 1/4
            args: --project=chromium --shard=1/4
          - name: Desktop-Chromium 2/4
            args: --project=chromium --shard=2/4
          - name: Desktop-Chromium 3/4
            args: --project=chromium --shard=3/4
          - name: Desktop-Chromium 4/4
            args: --project=chromium --shard=4/4
          # Ein Telefon ist der eigentliche Zielfall. Dieselbe Dateiliste wie
          # bisher — hier wird nichts weggelassen.
          - name: Mobile Release Gate
            args: >-
              --project=mobile
              tests/e2e/accessibility.spec.ts
              tests/e2e/install.spec.ts
              tests/e2e/livingInterface.spec.ts
              tests/e2e/memory.spec.ts
              tests/e2e/offlineFirstLaunch.spec.ts
              tests/e2e/resilience.spec.ts
              tests/e2e/session.spec.ts
              tests/e2e/sync.spec.ts
              tests/e2e/oauthResume.spec.ts
              tests/e2e/reset.spec.ts
              tests/e2e/coreNavigation.spec.ts
              tests/e2e/reminders.spec.ts
              tests/e2e/privacy.spec.ts
              tests/e2e/upgrade.spec.ts
          # Die Gerätematrix läuft nur den Layouttest, über sieben Profile.
          - name: Layout-Matrix
            args: tests/e2e/layout.spec.ts
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --force
      - name: Gebauten Stand holen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Browser für die E2E-Tests
        run: npx playwright install --with-deps chromium
      - name: ${{ matrix.name }}
        run: npx playwright test ${{ matrix.args }}

  # Ein verrutschter Scherbenschnitt darf nicht stillschweigend Tests
  # verschlucken. Die vier Scherben zusammen müssen genau so viele Desktop-
  # Tests ergeben wie der ungeteilte Lauf.
  zaehlung:
    needs: fundament
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --force
      - name: Scherben decken die ganze Suite ab
        run: |
          ganz=$(npx playwright test --project=chromium --list --reporter=json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);let n=0;const w=x=>{if(x.specs)n+=x.specs.length;(x.suites||[]).forEach(w)};(j.suites||[]).forEach(w);console.log(n)})")
          summe=0
          for i in 1 2 3 4; do
            teil=$(npx playwright test --project=chromium --shard=$i/4 --list --reporter=json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);let n=0;const w=x=>{if(x.specs)n+=x.specs.length;(x.suites||[]).forEach(w)};(j.suites||[]).forEach(w);console.log(n)})")
            echo "Scherbe $i/4: $teil Tests"
            summe=$((summe + teil))
          done
          echo "Ungeteilt: $ganz — Scherben zusammen: $summe"
          if [ "$ganz" != "$summe" ]; then
            echo "::error::Die Scherben decken nicht die ganze Suite ab ($summe von $ganz)."
            exit 1
          fi

  # Der Name dieses Jobs ist Vertrag: Die Branch-Protection verlangt eine
  # Prüfung namens `check`. Er fasst nur zusammen — und ist ausdrücklich
  # `always()`, damit er auch dann ein Ergebnis schreibt, wenn ein
  # vorgelagerter Job abgebrochen wurde, statt selbst zu verschwinden.
  check:
    needs: [fundament, e2e, zaehlung]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis der Teiljobs
        run: |
          echo "fundament: ${{ needs.fundament.result }}"
          echo "e2e:       ${{ needs.e2e.result }}"
          echo "zaehlung:  ${{ needs.zaehlung.result }}"
          if [ "${{ needs.fundament.result }}" != "success" ] \
            || [ "${{ needs.e2e.result }}" != "success" ] \
            || [ "${{ needs.zaehlung.result }}" != "success" ]; then
            echo "::error::Das Tor ist nicht grün."
            exit 1
          fi
          echo "Tor grün."

  # F-12 (Runde 2): Die Veröffentlichung hängt am vollen Tor desselben
  # Commits — `needs: check` lässt sie erst laufen, wenn Typen, Tests,
  # Budget und die komplette E2E-Matrix grün sind. Vorher lief der Deploy
  # als eigener Workflow **parallel** zur CI; ein Commit konnte live sein
  # und erst danach rot werden. deploy.yml bleibt nur als manueller Notweg.
  deploy:
    needs: check
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'anitew-redesign-v2')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '07613ddfc3f70bf92e9df8a9f9530552' }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID || '360791045103-jvbjtv7mdatp4f5svtcfj7uabjm7jdok.apps.googleusercontent.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --force
      - run: npm run build
      # Web Push darf nicht davon abhängen, dass die drei VAPID-Secrets
      # irgendwann einmal manuell gesetzt wurden (siehe deploy.yml).
      - name: Web-Push-Schlüssel sicherstellen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/configure-push.mjs
      - name: Veröffentlichen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      # Ein grüner Build beweist keine reale Push-Konfiguration.
      - name: Production Web Push prüfen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://anitew.impekaltech.workers.dev/push/vapid-public'
          const response = await fetch(url, { cache: 'no-store' })
          const body = await response.json().catch(() => ({}))
          if (!response.ok || typeof body.publicKey !== 'string' || body.publicKey.length < 40) {
            throw new Error(`Production Web Push ist nicht konfiguriert (HTTP ${response.status}).`)
          }
          console.log('Production Web Push ist konfiguriert.')
          NODE
      - name: Hinweis, wenn kein Token hinterlegt ist
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Kein CLOUDFLARE_API_TOKEN hinterlegt — gebaut, aber nicht veröffentlicht."
