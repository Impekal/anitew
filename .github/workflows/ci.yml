# Prüft jeden Push und jeden Pull Request (Backlog P3).
#
# Der Kern wird zweimal übersetzt: einmal als Teil der App, einmal für sich
# allein ohne DOM. Der zweite Durchgang ist die Durchsetzung von D-010 — wer in
# src/core/ nach `window` greift, scheitert hier und nicht erst beim Verpacken
# für die Stores.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    if: github.ref != 'refs/heads/anitew-phase2-staging' && github.head_ref != 'anitew-phase2-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typen prüfen (App und Kern getrennt)
        run: npm run typecheck
      - name: Tests (Kern, ohne Browser)
        run: npm test
      - name: Build
        run: npm run build
      - name: Kaltstart-Budget (P4)
        run: npm run size
      - name: Browser für die E2E-Tests
        run: npx playwright install --with-deps chromium
      - name: Tests (die gebaute App im Browser)
        run: npx playwright test --project=chromium

  ingest_phase2:
    if: github.ref == 'refs/heads/anitew-phase2-staging' || github.head_ref == 'anitew-phase2-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: anitew-phase2-staging
          fetch-depth: 0

      - name: Detect staged payload
        id: payload
        run: |
          if test -f .anitew-staging/phase2.part3.b64; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Decode staged patch
        if: steps.payload.outputs.present == 'true'
        run: |
          cat .anitew-staging/phase2.part1.b64 .anitew-staging/phase2.part2.b64 .anitew-staging/phase2.part3.b64 | base64 -d | gzip -d > /tmp/anitew-phase2.patch
          test "$(wc -c < /tmp/anitew-phase2.patch)" -eq 74135
          test "$(wc -l < /tmp/anitew-phase2.patch)" -eq 1747
          sha256sum /tmp/anitew-phase2.patch

      - name: Normalize transport-only typo in preimage
        if: steps.payload.outputs.present == 'true'
        run: sed -i 's/Widereholungsplan/Wiederholungsplan/g' /tmp/anitew-phase2.patch

      - name: Verify and apply patch
        if: steps.payload.outputs.present == 'true'
        run: |
          git apply --check /tmp/anitew-phase2.patch
          git apply /tmp/anitew-phase2.patch
          rm .anitew-staging/phase2.part1.b64 .anitew-staging/phase2.part2.b64 .anitew-staging/phase2.part3.b64

      - name: Repair reviewed Phase 2 logic
        if: steps.payload.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/core/memory/dailyMission.ts')
          s = p.read_text()
          s = s.replace("import { type DimensionId, moduleForDimension } from '../profile/dimensions.ts'", "import { type DimensionId, isImmediate, moduleForDimension } from '../profile/dimensions.ts'", 1)
          needle = "    const undertrained = (Object.entries(input.dimensions) as [DimensionId, DimensionCounts][])\n      .sort((a, b) => a[1].chances - b[1].chances || a[0].localeCompare(b[0]))[0]"
          replacement = "    const undertrained = (Object.entries(input.dimensions) as [DimensionId, DimensionCounts][])\n      .filter(([id, counts]) => counts.chances > 0 && !isImmediate(id) && moduleForDimension(id) !== undefined)\n      .sort((a, b) => a[1].chances - b[1].chances || a[0].localeCompare(b[0]))[0]"
          assert needle in s
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('src/core/memory/memoryPulse.ts')
          s = p.read_text()
          assert "| { kind: 'reinforced'; count: number }" in s
          s = s.replace("| { kind: 'reinforced'; count: number }", "| { kind: 'practiced'; count: number }", 1)
          assert "signals.push({ kind: 'reinforced', count: recent.length })" in s
          s = s.replace("signals.push({ kind: 'reinforced', count: recent.length })", "signals.push({ kind: 'practiced', count: recent.length })", 1)
          p.write_text(s)

          p = Path('src/app/MemoryPulse.tsx')
          s = p.read_text()
          assert "case 'reinforced':" in s and 'return t.reinforced' in s
          s = s.replace("case 'reinforced':", "case 'practiced':", 1)
          s = s.replace('return t.reinforced.replace', 'return t.practiced.replace', 1)
          p.write_text(s)

          replacements = {
              'src/i18n/de.ts': ("reinforced: '{count} Erinnerungen wurden in den letzten 24 Stunden abgerufen.',", "practiced: '{count} Erinnerungen wurden in den letzten 24 Stunden trainiert.',"),
              'src/i18n/en.ts': ("reinforced: '{count} memories were recalled in the last 24 hours.',", "practiced: '{count} memories were trained in the last 24 hours.',"),
          }
          for filename, (old, new) in replacements.items():
              p = Path(filename)
              s = p.read_text()
              assert old in s
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Setup Node
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.payload.outputs.present == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.payload.outputs.present == 'true'
        run: npm run typecheck

      - name: Core tests
        if: steps.payload.outputs.present == 'true'
        run: npm test

      - name: Production build
        if: steps.payload.outputs.present == 'true'
        run: npm run build

      - name: Size budget
        if: steps.payload.outputs.present == 'true'
        run: npm run size

      - name: Install Playwright Chromium
        if: steps.payload.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Phase 2 functional E2E
        if: steps.payload.outputs.present == 'true'
        run: npx playwright test tests/e2e/memory.spec.ts tests/e2e/onboarding.spec.ts tests/e2e/profile.spec.ts --project=chromium --max-failures=1

      - name: Phase 2 layout E2E
        if: steps.payload.outputs.present == 'true'
        run: npx playwright test tests/e2e/layout.spec.ts --project=desktop-small --max-failures=1

      - name: Commit validated Phase 2
        if: steps.payload.outputs.present == 'true'
        run: |
          git config user.name "ANITEW Staging Runner"
          git config user.email "actions@users.noreply.github.com"
          git diff --name-only -z --diff-filter=ACMRTUXB | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          git add -u -- .anitew-staging/phase2.part1.b64 .anitew-staging/phase2.part2.b64 .anitew-staging/phase2.part3.b64
          git diff --cached --check
          git commit -m "feat: stage ANITEW memory system phase two"
          git push origin HEAD:anitew-phase2-staging
