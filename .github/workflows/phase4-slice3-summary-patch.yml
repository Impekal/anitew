name: Phase 4 Slice 3 summary patch

on:
  push:
    branches: [anitew-phase4-slice3]
    paths: [.github/workflows/phase4-slice3-summary-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anitew-phase4-slice3
      - name: Carry factual landing into summary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/session/SessionScreen.tsx')
          text = path.read_text()
          replacements = [
            ("        language={state.plan.language}\n", "        language={state.plan.language}\n        landing={state.landingPulse}\n"),
            ("  language,\n  onLeave,\n", "  language,\n  landing,\n  onLeave,\n"),
            ("  language: string\n  onLeave: () => void\n", "  language: string\n  landing: boolean\n  onLeave: () => void\n"),
            ('    <main className="app summary-screen">', "    <main className={`app summary-screen${landing ? ' summary-memory-landing' : ''}`}>")
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'summary pattern not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/phase4-slice3-summary-patch.yml
      - name: Commit summary landing handoff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/session/SessionScreen.tsx .github/workflows/phase4-slice3-summary-patch.yml
          git commit -m "Carry factual memory landing into session summary"
          git push origin HEAD:anitew-phase4-slice3
